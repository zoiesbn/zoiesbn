{% seo %}
<script type="text/javascript">
  if (window.location.hostname === "zoies.ir" || window.location.hostname.endsWith(".zoies.ir")) {
    (function(c,l,a,r,i,t,y){
      c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
      t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
      y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "yilekvff84");

<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta property="og:locale" content="en_US">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "{% if page.project %}CreativeWork{% else %}Person{% endif %}",
  "name": {{ page.title | default: site.title | jsonify }},
  "description": {{ page.description | default: site.description | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }}{% if page.project %},
  "creator": { "@type": "Person", "name": "Zoha Sobhani" },
  "image": {{ page.image | absolute_url | jsonify }}{% else %},
  "jobTitle": "Product Designer",
  "sameAs": ["https://www.linkedin.com/in/zoha-sobhani-773103177/"]{% endif %}
}
</script>
